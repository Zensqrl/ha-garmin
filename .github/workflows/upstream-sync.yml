name: Upstream sync

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  UPSTREAM_REPO: cyberjunky/ha-garmin
  UPSTREAM_BRANCH: main
  FORK_BRANCH: main
  ISSUE_TITLE_PREFIX: "Upstream sync:"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.FORK_BRANCH }}
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream "${UPSTREAM_BRANCH}"

      - name: Assess drift and file issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="${ISSUE_TITLE_PREFIX} ${UPSTREAM_REPO}"
          existing=$(gh issue list --state open --search "\"${title}\" in:title" \
            --json number,title --jq "[.[] | select(.title | startswith(\"${title}\"))][0].number // empty")

          if git merge-base --is-ancestor "upstream/${UPSTREAM_BRANCH}" HEAD; then
            echo "Up to date with upstream/${UPSTREAM_BRANCH}."
            if [ -n "$existing" ]; then
              gh issue close "$existing" --comment "\`${FORK_BRANCH}\` now contains \`upstream/${UPSTREAM_BRANCH}\`. Closing."
            fi
            exit 0
          fi

          behind=$(git rev-list --count "HEAD..upstream/${UPSTREAM_BRANCH}")
          log=$(git log --oneline --no-merges "HEAD..upstream/${UPSTREAM_BRANCH}" | head -30)

          git merge --no-commit --no-ff "upstream/${UPSTREAM_BRANCH}" >/dev/null 2>&1 || true
          conflicts=$(git diff --name-only --diff-filter=U)
          git merge --abort 2>/dev/null || git reset --hard

          {
            echo "\`${FORK_BRANCH}\` is **${behind} commits behind** \`${UPSTREAM_REPO}@${UPSTREAM_BRANCH}\`."
            echo
            echo "Sync locally — ask the agent to \"sync my fork\", or:"
            echo
            echo '```bash'
            echo "git fetch upstream && git switch ${FORK_BRANCH}"
            echo "git merge upstream/${UPSTREAM_BRANCH}"
            echo '```'
            echo
            echo "Merge commit only. A squash keeps upstream's content but not its commits,"
            echo "so the \`git merge-base --is-ancestor\` check this job runs stays false"
            echo "forever and the issue reopens every week."
            echo
            if [ -n "$conflicts" ]; then
              echo "### Expected conflicts"
              echo
              echo '```'
              echo "$conflicts"
              echo '```'
              echo
              echo "These should all be overlay or version lines with deterministic"
              echo "resolutions — see the fork profile. Anything else means upstream"
              echo "changed something the fork also modified, and needs judgement."
              echo
            else
              echo "No conflicts — the merge is clean."
              echo
            fi
            echo "### Upstream commits"
            echo
            echo '```'
            echo "$log"
            echo '```'
            echo
            echo "After merging, run the verify commands and release; a merge alone"
            echo "changes nothing for consumers."
          } > /tmp/issue-body.md

          if [ -n "$existing" ]; then
            gh issue edit "$existing" --title "${title} (${behind} behind)" --body-file /tmp/issue-body.md
            echo "Updated issue #${existing}."
          else
            gh issue create --title "${title} (${behind} behind)" --body-file /tmp/issue-body.md
          fi
